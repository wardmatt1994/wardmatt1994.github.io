<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Publisher Domain</title>
  <style>
    body {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      background: linear-gradient(120deg, #f6f3ea 0%, #e9f0f3 100%);
      color: #1f2937;
      min-height: 100vh;
      display: grid;
      place-items: center;
    }
    main {
      width: min(720px, 92vw);
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid #d1d5db;
      border-radius: 14px;
      padding: 28px;
      box-shadow: 0 10px 30px rgba(17, 24, 39, 0.08);
    }
    h1 {
      margin-top: 0;
      font-size: 1.8rem;
      letter-spacing: 0.02em;
    }
    a {
      color: #0f766e;
      text-decoration: none;
      border-bottom: 1px dashed #0f766e;
    }
    a:hover {
      border-bottom-style: solid;
    }
    code {
      background: #f3f4f6;
      padding: 2px 6px;
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <main>
    <h1>Publisher Website</h1>
    <p>This domain hosts the app-ads.txt file for ad inventory verification.</p>
    <p>Open <a href="/app-ads.txt">/app-ads.txt</a> to view the authorized seller list.</p>
    <p>Status: <code>active</code></p>
  </main>
</body>
</html>
